openapi: 3.1.0
info:
  title: PitchPond API
  version: 1.0.0-beta.1
  description: Donation and reward crowdfunding API. Investment campaigns are rejected during beta.
servers:
  - url: http://localhost:8000/api/v1
paths:
  /status:
    get:
      summary: Service and feature-gate status
      responses:
        '200': { description: Healthy service }
  /campaigns:
    get:
      summary: List publicly visible campaigns
      parameters:
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
        - { in: query, name: type, schema: { type: string, enum: [donation, reward] } }
        - { in: query, name: region, schema: { type: string } }
        - { in: query, name: category, schema: { type: string } }
      responses:
        '200':
          description: Paginated campaigns
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Campaign' } }
    post:
      summary: Create a private campaign draft
      security: [{ sanctumSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignDraftInput' }
      responses:
        '200': { description: Draft created }
        '422': { $ref: '#/components/responses/ValidationError' }
  /campaigns/{slug}:
    get:
      summary: Get a campaign with reward tiers, readiness evidence, and updates
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
      responses:
        '200': { description: Campaign detail }
        '404': { description: Not found or not visible }
  /campaigns/{slug}/submit:
    post:
      summary: Submit a verified founder campaign for review
      security: [{ sanctumSession: [] }]
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
      responses:
        '200': { description: Submitted }
        '422': { description: Verification or reward requirements are incomplete }
  /campaigns/{slug}/pledges:
    post:
      summary: Create an all-or-nothing backing and payment session
      security: [{ sanctumSession: [] }]
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor]
              properties:
                amountMinor: { type: integer, minimum: 10000, description: PHP centavos }
                rewardTierId: { type: [integer, 'null'] }
                isAnonymous: { type: boolean }
                shippingAddress: { type: [object, 'null'], additionalProperties: false }
      responses:
        '201': { description: Pledge and checkout created }
        '409': { description: Campaign closed or reward sold out }
  /auth/login:
    post:
      summary: Start a Sanctum first-party session
      description: Call /sanctum/csrf-cookie before this endpoint.
      responses:
        '200': { description: Authenticated }
        '422': { description: Invalid credentials }
  /auth/register:
    post:
      summary: Register with a closed-beta invitation
      responses:
        '201': { description: Registered and signed in }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/me:
    get:
      summary: Current session user
      security: [{ sanctumSession: [] }]
      responses:
        '200': { description: Current user }
        '401': { description: Unauthenticated }
  /dashboard:
    get:
      summary: Role-specific founder, backer, or reviewer workspace data
      security: [{ sanctumSession: [] }]
      responses:
        '200': { description: Dashboard data }
  /webhooks/paymongo:
    post:
      summary: Receive a signed, idempotently processed PayMongo event
      parameters:
        - { in: header, name: Paymongo-Signature, required: true, schema: { type: string } }
      responses:
        '200': { description: Received or already processed }
        '401': { description: Invalid or stale signature }
components:
  securitySchemes:
    sanctumSession:
      type: apiKey
      in: cookie
      name: pitchpond_session
  schemas:
    Campaign:
      type: object
      required: [slug, title, type, status, fundingGoalMinor, raisedMinor, organization]
      properties:
        slug: { type: string }
        title: { type: string }
        type: { type: string, enum: [donation, reward] }
        status: { type: string, enum: [draft, submitted, needs_changes, approved, live, funded, failed, payout_pending, paid, fulfilling, completed, suspended, cancelled] }
        fundingGoalMinor: { type: integer }
        raisedMinor: { type: integer }
        backerCount: { type: integer }
        readinessChecks: { type: array, items: { type: object } }
        organization: { type: object }
        rewards: { type: array, items: { type: object } }
    CampaignDraftInput:
      type: object
      required: [organizationId, title, tagline, type, category, region, story, useOfFunds, risks, fundingGoalMinor, durationDays]
      properties:
        organizationId: { type: integer }
        title: { type: string, minLength: 8, maxLength: 140 }
        tagline: { type: string, minLength: 12, maxLength: 160 }
        type: { type: string, enum: [donation, reward] }
        category: { type: string }
        region: { type: string }
        story: { type: string, minLength: 120 }
        useOfFunds: { type: string, minLength: 40 }
        risks: { type: string, minLength: 40 }
        fundingGoalMinor: { type: integer, minimum: 500000 }
        durationDays: { type: integer, minimum: 7, maximum: 90 }
        rewards: { type: array, maxItems: 12, items: { type: object } }
  responses:
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors: { type: object }
